name: Panda QQ CI/CD & Multiplatform Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ========================================================
  # STAGE 1: C++20 CORE DSP VERIFICATION & BENCHMARK
  # ========================================================
  test-dsp:
    name: Verify C++ DSP Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++

      - name: Build DSP Engine & Tests
        run: cmake --build build

      - name: Run Core DSP Unit Tests
        run: ./build/test_dsp_engine

      - name: Run Stress & Latency Benchmark
        run: ./build/stress_and_benchmark_test

  # ========================================================
  # STAGE 2: COMPILE ANDROID APK
  # ========================================================
  build-apk:
    name: Build Android APK
    needs: test-dsp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Make Gradle Executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Clarity
        run: |
          mkdir -p output_apks
          cp android/app/build/outputs/apk/debug/*.apk output_apks/PandaQQ-v1.0.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaQQ-Android-APK
          path: output_apks/PandaQQ-v1.0.0-debug.apk
          retention-days: 14

  # ========================================================
  # STAGE 3: COMPILE macOS DESKTOP APP
  # ========================================================
  build-macos:
    name: Build macOS Desktop App
    needs: test-dsp
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build PandaQQ.app
        run: cmake --build build --target PandaQQ

      - name: Package App Bundle into Zip
        run: |
          cd build
          mkdir -p PandaQQ.app/Contents/Resources
          cp ../docs/panda_qq_icon.png PandaQQ.app/Contents/Resources/AppIcon.png || true
          zip -r PandaQQ-macOS.zip PandaQQ.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaQQ-macOS-Desktop
          path: build/PandaQQ-macOS.zip
          retention-days: 14

  # ========================================================
  # STAGE 4: AUTOMATED GITHUB RELEASES (Triggered on Tags)
  # ========================================================
  create-release:
    name: Publish GitHub Release
    needs: [build-apk, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PandaQQ-Android-APK
          path: release_artifacts

      - name: Download macOS App
        uses: actions/download-artifact@v4
        with:
          name: PandaQQ-macOS-Desktop
          path: release_artifacts

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/PandaQQ-v1.0.0-debug.apk
            release_artifacts/PandaQQ-macOS.zip
          name: Panda QQ Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🐼 Panda QQ - Live Karaoke Multiplatform Suite (${{ github.ref_name }})
            
            ### 📥 Download Installer:
            - 📱 **Android**: Unduh file **`PandaQQ-v1.0.0-debug.apk`** untuk smartphone Android.
            - 🍏 **macOS**: Unduh file **`PandaQQ-macOS.zip`**, ekstrak dan jalankan **`PandaQQ.app`** di MacBook / Mac desktop Anda!
            
            ### 🚀 Fitur Unggulan Versi Ini:
            - **Multiplatform Support**: Android (Mobile 2-HP setup) dan macOS (Desktop Widescreen Studio).
            - **Layar YouTube Karaoke 16:9** dengan pencarian cepat dan transpose nada (*Key Shifter*).
            - **Tombol Cepat Send FX**: Stompbox instan untuk `Reverb`, `Delay`, `Harmoni`, dan `Sub-Bass Booster`.
            - **Studio Insert Rack**: Noise Gate, De-Esser, 7-Band EQ, Opto Vocal Compressor, dan True-Peak Limiter (-1.0 dBTP).
            - **Auto-Carve**: Otomatis melubangi frekuensi musik YouTube saat vokal bernyanyi.
            
            ### 💖 Donasi & Dukungan:
            Dukung pengembang via DANA, GoPay, OVO ke nomor: **082116929992**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
